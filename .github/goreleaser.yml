project_name: certstream-server-go

before:
  hooks:
    - go mod download

builds:
  - id: certstream-server-go
    main: ./cmd/certstream-server-go
    binary: certstream-server-go
    ldflags: -s -w -X github.com/d-Rickyy-b/certstream-server-go/internal/config.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: 386

  # Standalone egress proxy, built for the same platforms as the server.
  - id: certstream-proxy
    main: ./cmd/certstream-proxy
    binary: certstream-proxy
    ldflags: -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - 386
      - amd64
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: 386
checksum:
  name_template: '{{.ProjectName}}_{{.Version}}_checksums.txt'
changelog:
  disable: true

dockers:
  - image_templates:
      - 'ghcr.io/pki-tools/{{.ProjectName}}:{{.Tag}}-amd64'
      - '{{ if not .Prerelease }}ghcr.io/pki-tools/{{.ProjectName}}:latest-amd64{{ end }}'
    ids:
      - certstream-server-go
    goarch: amd64
    use: buildx
    extra_files:
      - config.sample.yaml
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.description=Certstream server written in Go"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.source=https://github.com/pki-tools/certstream-server-go"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--platform=linux/amd64"

  - image_templates:
      - 'ghcr.io/pki-tools/{{.ProjectName}}:{{.Tag}}-arm64'
      - '{{ if not .Prerelease }}ghcr.io/pki-tools/{{.ProjectName}}:latest-arm64{{ end }}'
    ids:
      - certstream-server-go
    goarch: arm64
    use: buildx
    extra_files:
      - config.sample.yaml
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.description=Certstream server written in Go"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.source=https://github.com/pki-tools/certstream-server-go"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--platform=linux/arm64"

docker_manifests:
  - name_template: 'ghcr.io/pki-tools/{{.ProjectName}}:{{.Tag}}'
    image_templates:
      - 'ghcr.io/pki-tools/{{.ProjectName}}:{{.Tag}}-amd64'
      - 'ghcr.io/pki-tools/{{.ProjectName}}:{{.Tag}}-arm64'

  - name_template: '{{ if not .Prerelease }}ghcr.io/pki-tools/{{.ProjectName}}:latest{{ end }}'
    image_templates:
      - 'ghcr.io/pki-tools/{{.ProjectName}}:{{.Tag}}-amd64'
      - 'ghcr.io/pki-tools/{{.ProjectName}}:{{.Tag}}-arm64'

archives:
  - id: server
    builds:
      - certstream-server-go
    format: binary
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version}}_
      {{- if eq .Os "darwin" }}macOS{{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "386" }}i386{{- else }}{{ .Arch }}{{ end }}

  - id: proxy
    builds:
      - certstream-proxy
    format: binary
    name_template: >-
      {{- "certstream-proxy_" }}
      {{- .Version}}_
      {{- if eq .Os "darwin" }}macOS{{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "386" }}i386{{- else }}{{ .Arch }}{{ end }}
