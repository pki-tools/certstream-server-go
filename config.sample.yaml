webserver:
  # For IPv6, set the listen_addr to "::"
  listen_addr: "0.0.0.0"
  listen_port: 8080
  # If you want to use a reverse proxy in front of the server, set this to true
  # It will use the X-Forwarded-For header to get the real IP of the client
  real_ip: false
  full_url: "/full-stream"
  lite_url: "/"
  domains_only_url: "/domains-only"
  cert_path: ""
  cert_key_path: ""
  compression_enabled: false

  # Optionally serve the HTML dashboards (/log-status, /ccadb, /errors,
  # /dashboard) on their own listener, separate from the websocket endpoints.
  # Useful behind a reverse proxy, where the websocket backend wants long
  # tunnel timeouts while the UI is an ordinary short-lived HTTP backend.
  # When disabled, the dashboards are served on the websocket port as before.
  #
  # Note: /health is always registered on every listener regardless of this
  # setting. Point load balancer health checks at it — the websocket endpoints
  # answer plain HTTP with 426 Upgrade Required, which most health checks
  # (including HAProxy's httpchk) treat as a failure.
  ui:
    enabled: false
    # Defaults to the same interface as the websocket listener when left empty.
    listen_addr: ""
    listen_port: 8081
    real_ip: false
    cert_path: ""
    cert_key_path: ""
    whitelist: []

prometheus:
  enabled: true
  listen_addr: "0.0.0.0"
  listen_port: 8080
  metrics_url: "/metrics"
  expose_system_metrics: false
  real_ip: false
  whitelist:
    - "127.0.0.1/8"

general:
  # DisableDefaultLogs indicates whether the default logs used in Google Chrome and provided by Google should be disabled.
  disable_default_logs: false
  # When you want to add logs that are not contained in the log list provided by
  # Google (https://www.gstatic.com/ct/log_list/v3/log_list.json), you can add them here.
  additional_logs:
    - url: https://ct.googleapis.com/logs/us1/mirrors/digicert_nessie2022
      operator: "DigiCert"
      description: "DigiCert Nessie2022 log"

  # To optimize the performance of the server, you can overwrite the size of different buffers
  # For low CPU, low memory machines, you should reduce the buffer sizes to save memory in case the CPU is maxed.
  buffer_sizes:
    # Buffer for each websocket connection
    websocket: 300
    # Buffer for each CT log connection
    ctlog: 1000
    # Combined buffer for the broadcast manager
    broadcastmanager: 10000

  # Google regularly updates the log list. If this option is set to true, the server will remove all logs no longer listed in the Google log list.
  # This option defaults to true. See https://github.com/d-Rickyy-b/certstream-server-go/issues/51
  drop_old_logs: true

  # Optional egress proxies. Each entry is a certstream-proxy instance running
  # on another IP address; logs are distributed across them by a stable hash, so
  # a given log always fetches through the same egress (its rate-limit bucket is
  # per source address, so spreading one log's requests would be counterproductive).
  # Leave empty to fetch everything directly. See proxy.sample.yaml.
  proxies: []
  #  - name: "eu-1"
  #    url: "https://198.51.100.7:8443"
  #    token: "the-same-token-as-that-proxys-auth_token"
  #  - name: "us-1"
  #    url: "https://198.51.100.8:8443"
  #    token: "..."

  # Expose Go's profiling endpoints under /debug/pprof on the web UI listener.
  # Off by default. With it on:
  #   go tool pprof http://host:port/debug/pprof/profile?seconds=30
  # shows exactly which functions the CPU time goes to - the tool to reach for
  # once /system reports the process is CPU-bound. Restrict the listener first:
  # the profiles reveal internals and capturing one briefly costs CPU.
  pprof: false

  # Optional historical dashboard at /dashboard. Periodically snapshots log state
  # into a local SQLite file and renders charts over 1h/12h/24h/3d/7d windows,
  # covering the common cases that would otherwise need Prometheus + Grafana.
  dashboard:
    # Disabled by default. When off, no database is opened and no samples are taken.
    enabled: false
    # SQLite file used to persist samples. Needs write permission on the directory
    # (WAL mode also creates "-wal" and "-shm" files alongside it).
    db_path: "./dashboard.db"
    # How often (seconds) to snapshot log state. Lower means finer charts and a
    # larger database; 60 is a good balance.
    sample_interval: 60
    # How long to keep samples. Older rows are pruned hourly.
    # With ~100 logs at a 60s interval, 7 days is roughly 50-80 MB.
    retention_days: 7

  # Options for resuming certificate downloads after restart
  recovery:
    # If enabled, the server will resume downloading certificates from the last processed and stored index for each log.
    # If there is no ct_index_file or for a specific log there is no index entry, the server will start from index 0.
    # Be aware that this leads to a massive number of certificates being downloaded.
    # Depending on your server's performance and network connection, this could be up to 10.000 certificates per second.
    # Make sure your infrastructure can handle this!
    enabled: true
    # If start_at_head is true and there is no ct_index.json (or no saved index for a log), the server will
    # begin from the current STH/tree size instead of index 0. Recovery is still enabled, so positions are
    # saved and restored on restart. This avoids the massive initial download that occurs with recovery
    # enabled alone, while still providing resumption on subsequent restarts.
    # Requires recovery to be enabled (will auto-enable it if not).
    start_at_head: false
    # Path to the file where indices are stored. Be aware that a temp file in the same path with the same name and ".tmp" as suffix will be created.
    # If there are no write permissions to the path, the server will not be able to store the indices.
    ct_index_file: "./ct_index.json"
